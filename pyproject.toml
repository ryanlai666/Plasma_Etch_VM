[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plasma-etch-vm"
version = "0.1.0"
description = "Open virtual-metrology benchmark for BOSCH plasma etching (OES + tool traces -> etch depth/uniformity) with calibrated uncertainty"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "polars>=1.0",
    "duckdb>=1.0",
    "pyarrow>=15",
    "h5py>=3.10",
    "h5netcdf>=1.3",
    "netCDF4>=1.6",
    "xarray>=2024.1",
    "openpyxl>=3.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "pyyaml>=6",
    "pydantic>=2.5",
    "mlflow>=2.12",
    "psutil>=5.9",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dl = ["torch>=2.4"]
interp = ["shap>=0.45"]
serve = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "httpx>=0.27"]
dashboard = ["streamlit>=1.35", "plotly>=5.20", "matplotlib>=3.8"]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27"]

[project.scripts]
pevm = "plasma_etch_vm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
plasma_etch_vm = ["py.typed"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["notebooks", "mlruns", "data", "outputs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "NPY", "RUF"]
ignore = [
    "N803",   # argument names like X (sklearn convention)
    "N806",   # variable names like X
    "RUF001", "RUF002", "RUF003",  # unicode (µm, ±) in strings/comments is intentional
    "B905",   # zip strict
    "N812",   # `import ... figures as F` (conventional alias)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
# report generators: long markdown f-strings are kept on one line for readability of the output template
"scripts/review_analyses.py" = ["E501"]
"scripts/summarize_results.py" = ["E501"]
"scripts/idle_features.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "data: needs the downloaded raw dataset under data/raw (skipped otherwise)",
    "gpu: needs CUDA",
]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
